<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parkings Sion — Carte & Simulateur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <link rel="stylesheet" href="style.css">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" id="metaThemeColor" content="#0F172A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Parkings Sion">
  <link rel="apple-touch-icon" href="/icon.svg">
</head>
<body>

<div id="map" aria-label="Carte des parkings de Sion"></div>

<aside class="panel" id="panel">
  <button type="button" class="panel-grip" id="panelGrip" aria-label="Replier le panneau" aria-expanded="true"></button>

  <header class="panel-header">
    <div class="brand">
      <svg class="valais-shield" viewBox="0 0 24 30" xmlns="http://www.w3.org/2000/svg" aria-label="Armoiries du Valais" role="img">
        <defs>
          <clipPath id="vs-clip">
            <path d="M12 .5 L23.5 4 L23.5 18 C23.5 25 12 29.5 12 29.5 C12 29.5 .5 25 .5 18 L.5 4 Z"/>
          </clipPath>
          <polygon id="s5" points="0,-1.35 .32,-.42 1.28,-.42 .48,.16 .79,1.09 0,.5 -.79,1.09 -.48,.16 -1.28,-.42 -.32,-.42"/>
        </defs>
        <g clip-path="url(#vs-clip)">
          <rect x="0" y="0" width="12" height="30" fill="#FFFFFF"/>
          <rect x="12" y="0" width="12" height="30" fill="#CE1126"/>
          <use href="#s5" x="12" y="6.5" fill="#CE1126"/>
          <use href="#s5" x="7.5" y="10.5" fill="#CE1126"/><use href="#s5" x="16.5" y="10.5" fill="#FFFFFF"/>
          <use href="#s5" x="4.5" y="14.5" fill="#CE1126"/><use href="#s5" x="12" y="14.5" fill="#FFFFFF"/><use href="#s5" x="19.5" y="14.5" fill="#FFFFFF"/>
          <use href="#s5" x="3.5" y="18.5" fill="#CE1126"/><use href="#s5" x="8.5" y="18.5" fill="#CE1126"/><use href="#s5" x="15.5" y="18.5" fill="#FFFFFF"/><use href="#s5" x="20.5" y="18.5" fill="#FFFFFF"/>
          <use href="#s5" x="6" y="22.5" fill="#CE1126"/><use href="#s5" x="12" y="22.5" fill="#FFFFFF"/><use href="#s5" x="18" y="22.5" fill="#FFFFFF"/>
        </g>
        <path d="M12 .5 L23.5 4 L23.5 18 C23.5 25 12 29.5 12 29.5 C12 29.5 .5 25 .5 18 L.5 4 Z" stroke="rgba(0,0,0,.25)" stroke-width=".6" fill="none"/>
      </svg>
      <div class="brand-text">
        <h1 class="brand-title">Parkings <span>Sion</span></h1>
        <span class="brand-sub">Canton du Valais · 7 parkings</span>
      </div>
    </div>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Basculer le thème">
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </header>

  <div class="panel-scroll">

    <section class="simulator">
      <div class="sim-tabs" role="tablist">
        <button class="sim-tab active" id="tabAll" onclick="setMode('all')" role="tab" aria-selected="true">
          <span class="tab-marker"></span>Comparer tous
        </button>
        <button class="sim-tab" id="tabSingle" onclick="setMode('single')" role="tab" aria-selected="false">
          <span class="tab-marker"></span>Un parking
        </button>
      </div>

      <div class="sim-sub">
        <span class="sim-icon-wrap" id="simIcon" aria-hidden="true">◉</span>
        <div>
          <h2 id="simTitle">Comparer tous les parkings</h2>
          <p id="simSubtitle">Classement du moins cher au plus cher pour la période choisie</p>
        </div>
      </div>

      <div class="vehicle-toggle" role="radiogroup" aria-label="Type de véhicule">
        <button class="vehicle-btn active" id="vehCar" onclick="setVehicule('voiture')" role="radio" aria-checked="true">
          <span class="vehicle-ico">🚗</span>
          <span class="vehicle-lbl">Voiture</span>
        </button>
        <button class="vehicle-btn" id="vehMoto" onclick="setVehicule('moto')" role="radio" aria-checked="false">
          <span class="vehicle-ico">🏍</span>
          <span class="vehicle-lbl">Moto</span>
        </button>
      </div>

      <div class="sim-body">
        <div class="sim-form">
          <div class="form-field full" id="fieldParking">
            <label class="field-label" for="selParking">Parking</label>
            <select class="field-input" id="selParking"></select>
          </div>
          <div class="form-field">
            <label class="field-label" for="inpArrivee">Arrivée</label>
            <input class="field-input" type="datetime-local" id="inpArrivee">
          </div>
          <div class="form-field">
            <label class="field-label" for="inpDepart">Départ</label>
            <input class="field-input" type="datetime-local" id="inpDepart">
          </div>
        </div>

        <button class="btn-calc" id="btnCalc" onclick="comparer()">Comparer les parkings</button>
        <div class="alert error" id="alertError"></div>

        <div class="result" id="result">
          <div class="result-hero">
            <div class="result-info">
              <h3 id="resNom"></h3>
              <p id="resPeriode"></p>
              <a id="resMapsLink" class="res-maps-link" href="#" target="_blank" rel="noopener" style="display:none">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                <span>Itinéraire Google Maps</span>
              </a>
            </div>
            <div class="result-amount">
              <div class="result-chf">
                <span class="cur">CHF</span>
                <span id="resTotal">0.00</span>
              </div>
              <div class="result-savings" id="resSavings"></div>
            </div>
          </div>
          <div class="breakdown">
            <div class="breakdown-head">Détail de facturation</div>
            <table class="breakdown-table">
              <thead>
                <tr>
                  <th>Période</th>
                  <th>Durée</th>
                  <th>Tarif</th>
                  <th>Montant</th>
                </tr>
              </thead>
              <tbody id="breakdownBody"></tbody>
            </table>
          </div>
          <div class="result-footer" id="resultFooter">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="resultNote"></span>
          </div>
        </div>

        <div class="comparison" id="comparison">
          <div class="comp-header">
            <div class="comp-period" id="compPeriode"></div>
            <div class="comp-legend">
              <span class="comp-legend-item legend-best">Meilleur</span>
              <span class="comp-legend-item legend-saving">Économie</span>
            </div>
          </div>
          <div class="comp-list" id="compList"></div>
        </div>
      </div>
    </section>

    <div class="section-label"><span id="sectionLabelText">Les 7 parkings</span></div>
    <div class="parking-list" id="parkingGrid"></div>

  </div>
</aside>

<button class="map-recenter" id="btnRecenter" aria-label="Recentrer la carte">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>

<script src="app.js"></script>
</body>
</html>
